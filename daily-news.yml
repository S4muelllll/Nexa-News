name: NEXA NEWS - aggiornamento automatico ogni 5 minuti
on:
  workflow_dispatch:
  schedule:
    - cron: '2/5 * * * *'
      timezone: 'Europe/Rome'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch and rank fresh stories
        run: python update_news.py
      - name: Save updated edition data
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No content changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update NEXA NEWS edition"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Pages
        if: steps.save.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: steps.save.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish site
        id: deployment
        if: steps.save.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4
